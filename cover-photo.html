<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budgie | Facebook Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Budgie V5 palette */
    --surface: #efebe3;
    --surface-low: #efebe3;
    --surface-lower: #dbd7cd;
    --surface-white: #ffffff;
    --primary: #013220;
    --primary-container: #004d1b;
    --ink: #1b1c1a;
    --muted: #414942;
    --mineral: #fdf3e7;
    --sage: #e9f6ef;
    --neon: #41eda4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #d6d2c9;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .cover {
     /* Matches the wide spreadsheet header area shown in the reference. */
    width: 1230px;
     height: 384px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    color: var(--ink);
    background:
      radial-gradient(circle at 74% 20%, rgba(65, 237, 164, 0.16), transparent 28%),
      radial-gradient(circle at 21% 92%, rgba(253, 243, 231, 0.95), transparent 30%),
      linear-gradient(135deg, #ffffff 0%, var(--surface) 44%, var(--surface) 100%);
  }

  .cover::before,
  .cover::after {
    content: "";
    position: absolute;
    z-index: -1;
    pointer-events: none;
  }

  .cover::before {
    width: 520px;
    height: 520px;
    right: -190px;
    top: -105px;
    border-radius: 50%;
    background: rgba(1, 50, 32, 0.055);
  }

  .cover::after {
    width: 430px;
    height: 430px;
    left: -170px;
    bottom: -205px;
    border-radius: 50%;
    background: rgba(1, 50, 32, 0.08);
  }

  .orbital {
    position: absolute;
    inset: auto 34px 26px auto;
    width: 620px;
    height: 420px;
    color: rgba(1, 50, 32, 0.08);
    z-index: -1;
    animation: orbital-drift 18s ease-in-out infinite alternate;
  }

  .grain {
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0.42;
    background-image:
      linear-gradient(rgba(1, 50, 32, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(1, 50, 32, 0.02) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  }

  .masthead {
    position: absolute;
     top: 28px;
    left: 58px;
    right: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    z-index: 2;
    animation: rise-in 800ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .brand-lockup {
    display: inline-flex;
    align-items: center;
    gap: 18px;
  }

  .mark {
     width: 64px;
     height: 64px;
    padding: 7px;
    border-radius: 19px;
    background: rgba(255, 255, 255, 0.54);
    box-shadow: 0 10px 40px rgba(27, 28, 26, 0.05);
    backdrop-filter: blur(24px);
  }

  .mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .wordmark {
     font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 30px;
    color: var(--primary);
  }

  .content {
    position: absolute;
    left: 76px;
     top: 108px;
     width: 690px;
    animation: rise-in 900ms 120ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .kicker {
     margin-bottom: 12px;
    color: var(--muted);
     font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  h1 {
    max-width: 650px;
    color: var(--primary);
     font-size: 64px;
    font-weight: 500;
    line-height: 0.94;
    letter-spacing: -0.06em;
  }

  h1 strong {
    display: block;
    margin-left: 46px;
    font-weight: 800;
    color: var(--primary);
  }

  .subcopy {
     width: 570px;
     margin-top: 16px;
    margin-left: 50px;
    color: var(--muted);
     font-size: 20px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: -0.025em;
  }

  .signature {
    position: absolute;
     left: 76px;
     bottom: 40px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .signature-line {
    width: 100px;
    height: 7px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--primary), var(--primary-container));
  }

  .signature-text {
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .showcase {
    position: absolute;
    right: 24px;
     top: 28px;
     width: 500px;
     height: 356px;
    animation: showcase-in 1000ms 180ms cubic-bezier(0.16, 1, 0.3, 1) both;
    will-change: transform, opacity;
  }

  .vault-card {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transform: rotate(4deg);
    animation: float 6s ease-in-out 1.1s infinite;
  }

  .vault-card::before {
    content: none;
  }

  .device {
    width: 236px;
    height: 470px;
    margin: 40px 150px 0 0;
    padding: 7px;
    border-radius: 36px;
    background: var(--ink);
    box-shadow: 0 26px 90px rgba(18, 30, 24, 0.22);
  }

  .device img {
    width: 100%;
    display: block;
    border-radius: 29px;
  }

  .vault-card::after {
    content: none;
  }

  .metric {
    position: absolute;
    left: 36px;
    top: 38px;
    z-index: 2;
  }

  .metric-label {
    color: #748078;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .metric-value {
    margin-top: 8px;
    color: var(--primary);
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.06em;
  }

  .metric-value span {
    font-weight: 300;
  }

  .rings {
    position: absolute;
    right: 40px;
    top: 70px;
    width: 138px;
    height: 138px;
    z-index: 2;
  }

  .rings svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .rings .base { stroke: #d6e1da; }

  .rings .progress {
    stroke: var(--primary-container);
    stroke-linecap: round;
    stroke-dasharray: 252;
    stroke-dashoffset: 72;
  }

  .rings-label {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--primary);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }

  .chips {
    position: absolute;
    left: 36px;
    right: 36px;
    top: 175px;
    display: flex;
    gap: 12px;
    z-index: 2;
  }

  .chip {
    min-height: 48px;
    padding: 9px 14px;
    border-radius: 18px;
    background: rgba(1, 50, 32, 0.055);
    color: #345348;
  }

  .chip:first-child { background: rgba(232, 227, 213, 0.72); }

  .chip b {
    display: block;
    color: #16342a;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .chip span {
    display: block;
    margin-top: 1px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .forecast {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 55px;
    z-index: 2;
    display: flex;
    align-items: end;
    gap: 9px;
  }

  .bar {
    flex: 1;
    border-radius: 999px 999px 10px 10px;
    background: linear-gradient(180deg, var(--primary-container) 0%, var(--primary) 100%);
    opacity: 0.95;
  }

  .bar:nth-child(1) { height: 26px; opacity: 0.36; }
  .bar:nth-child(2) { height: 46px; opacity: 0.48; }
  .bar:nth-child(3) { height: 34px; opacity: 0.6; }
  .bar:nth-child(4) { height: 62px; }
  .bar:nth-child(5) { height: 42px; opacity: 0.72; }

  .phone {
    position: absolute;
    left: 0;
    top: 76px;
    width: 138px;
    height: 246px;
    padding: 8px;
    border-radius: 34px;
    background: var(--ink);
    box-shadow: 0 22px 70px rgba(18, 30, 24, 0.22);
    transform: rotate(-7deg);
    overflow: hidden;
    display: none;
  }

  .phone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    border-radius: 26px;
    display: block;
  }

  .vault-card > .metric,
  .vault-card > .rings,
  .vault-card > .chips,
  .vault-card > .forecast { display: none; }

  .vault-card::after {
    content: "";
  }

  .vault-card > img {
     width: 275px;
    height: auto;
    object-fit: contain;
    position: relative;
    z-index: 1;
     transform: translate(-22px, 0);
    filter: drop-shadow(0 25px 24px rgba(16, 36, 29, 0.18));
  }

  .trend-graphic {
    position: absolute;
    left: 18px;
    right: 68px;
    bottom: 8px;
    height: 108px;
    color: rgba(1, 50, 32, 0.28);
    z-index: -1;
    transform: rotate(-2deg);
    filter: drop-shadow(0 14px 18px rgba(1, 50, 32, 0.1));
  }

  .trend-graphic svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .trend-graphic .guide {
    stroke: currentColor;
    stroke-width: 1;
    stroke-dasharray: 4 7;
    opacity: 0.42;
  }

  .trend-graphic .trend {
    fill: none;
    stroke: var(--primary-container);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .trend-graphic .expense {
    fill: none;
    stroke: #b84c4c;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 7 6;
  }

  .trend-graphic .area {
    fill: rgba(1, 50, 32, 0.08);
    stroke: none;
  }

  .trend-graphic .marker {
    fill: var(--primary-container);
    stroke: var(--surface);
    stroke-width: 4;
  }

  .trend-graphic .expense-marker {
    fill: #b84c4c;
    stroke: var(--surface);
    stroke-width: 4;
  }

  .money-graphic {
    position: absolute;
    left: 44px;
    bottom: 150px;
    width: 286px;
    height: 118px;
    padding: 18px 18px 15px;
    border: 1px solid rgba(1, 50, 32, 0.1);
    border-radius: 25px;
    background: rgba(255, 253, 250, 0.7);
    box-shadow: 0 18px 42px rgba(16, 36, 29, 0.08);
    color: var(--primary);
    z-index: -1;
    transform: rotate(-3deg);
    backdrop-filter: blur(12px);
  }

  .money-graphic header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .money-graphic label,
  .money-graphic small {
    color: #718077;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .money-graphic strong {
    color: var(--primary);
    font-size: 14px;
    letter-spacing: -0.04em;
  }

  .money-bars {
    display: flex;
    align-items: end;
    gap: 8px;
    height: 54px;
    border-bottom: 1px solid rgba(1, 50, 32, 0.13);
    background: repeating-linear-gradient(to bottom, transparent 0 17px, rgba(1, 50, 32, 0.07) 18px);
  }

  .money-bars i {
    flex: 1;
    min-width: 12px;
    height: var(--bar-height);
    border-radius: 7px 7px 2px 2px;
    background: linear-gradient(180deg, #4c9478, #064e3b);
    opacity: 0.82;
  }

  .money-bars i:nth-child(2n) { background: #d6b878; opacity: 0.75; }

  .peso-note {
    position: absolute;
    right: -18px;
    top: -19px;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 5px solid rgba(255, 253, 250, 0.8);
    border-radius: 50%;
    background: #d6b878;
    color: #51401e;
    font-size: 21px;
    font-weight: 800;
    box-shadow: 0 12px 24px rgba(81, 64, 30, 0.16);
    transform: rotate(12deg);
  }

  .money-graphic small { display: block; margin-top: 7px; }

  .signal-graphic {
    position: absolute;
    left: 116px;
    right: 108px;
    top: 96px;
    height: 126px;
    color: rgba(1, 50, 32, 0.2);
    z-index: -1;
    opacity: 0.8;
    transform: rotate(2deg);
  }

  .signal-graphic svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .signal-graphic .axis {
    stroke: currentColor;
    stroke-width: 1;
    stroke-dasharray: 3 7;
  }

  .signal-graphic .bar {
    fill: rgba(1, 50, 32, 0.13);
  }

  .signal-graphic .bar:nth-of-type(2n) {
    fill: rgba(184, 76, 76, 0.12);
  }

  .signal-graphic .pulse {
    fill: none;
    stroke: rgba(1, 50, 32, 0.38);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .signal-graphic .node {
    fill: var(--surface);
    stroke: var(--primary-container);
    stroke-width: 2;
  }

  .showcase::after {
    content: "";
    position: absolute;
    left: 58px;
    right: 82px;
    bottom: -4px;
    height: 28px;
    border-radius: 50%;
    background: rgba(16, 36, 29, 0.16);
    filter: blur(16px);
    z-index: -2;
  }

  .floating-note {
    position: absolute;
    right: 0;
     bottom: 20px;
     width: 220px;
     min-height: 104px;
     padding: 20px 22px;
    border-radius: 29px;
    background: rgba(1, 50, 32, 0.93);
    color: #ffffff;
    box-shadow: 0 26px 90px rgba(18, 30, 24, 0.18);
    animation: note-in 700ms 850ms cubic-bezier(0.16, 1, 0.3, 1) both, note-float 5s 2s ease-in-out infinite;
    will-change: transform, opacity;
  }

  .floating-note span {
    display: block;
    margin-bottom: 5px;
    color: var(--neon);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .floating-note strong {
     font-size: 21px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.04em;
  }

  .safe-zone {
    position: absolute;
    inset: 26px;
    border-radius: 44px;
    pointer-events: none;
    box-shadow: inset 0 0 0 999px rgba(250, 249, 245, 0);
  }

  .corner {
    position: absolute;
    width: 42px;
    height: 42px;
    color: rgba(1, 50, 32, 0.12);
  }

  .corner--tl { left: 30px; top: 30px; }
  .corner--tr { right: 30px; top: 30px; transform: scaleX(-1); }
  .corner--bl { left: 30px; bottom: 30px; transform: scaleY(-1); }
  .corner--br { right: 30px; bottom: 30px; transform: scale(-1); }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes showcase-in {
    from { opacity: 0; transform: translate(22px, 12px) scale(.97); }
    to { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  @keyframes float {
    0%, 100% { transform: rotate(4deg) translateY(0); }
    50% { transform: rotate(3deg) translateY(-8px); }
  }

  @keyframes note-in {
    from { opacity: 0; transform: translate(18px, 16px) scale(.94); }
    to { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  @keyframes note-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes orbital-drift {
    from { transform: translate(0, 0) rotate(0deg); }
    to { transform: translate(-18px, -8px) rotate(2deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<main class="cover" aria-label="Budgie Facebook promotional cover">
  <div class="grain"></div>

  <svg class="orbital" viewBox="0 0 620 420" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M83 420V207C83 80 154 23 310 23C466 23 537 80 537 207V420" stroke="currentColor" stroke-width="2"/>
    <path d="M137 420V219C137 119 191 74 310 74C429 74 483 119 483 219V420" stroke="currentColor" stroke-width="1.5"/>
    <path d="M195 420V231C195 157 230 124 310 124C390 124 425 157 425 231V420" stroke="currentColor" stroke-width="1"/>
  </svg>

  <div class="corner corner--tl" aria-hidden="true">
    <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M42 1H1V42" stroke="currentColor" stroke-width="2"/></svg>
  </div>
  <div class="corner corner--tr" aria-hidden="true">
    <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M42 1H1V42" stroke="currentColor" stroke-width="2"/></svg>
  </div>
  <div class="corner corner--bl" aria-hidden="true">
    <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M42 1H1V42" stroke="currentColor" stroke-width="2"/></svg>
  </div>
  <div class="corner corner--br" aria-hidden="true">
    <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M42 1H1V42" stroke="currentColor" stroke-width="2"/></svg>
  </div>

  <header class="masthead">
    <div class="brand-lockup">
      <div class="mark"><img src="public/budgie-mark.png" alt=""></div>
      <div class="wordmark">Budgie</div>
    </div>
  </header>

  <section class="content">
    <div class="kicker">Made for Filipino money habits</div>
     <h1>Reduce debt.<strong>Build wealth.</strong></h1>
  </section>

   <div class="signature" aria-hidden="true">
     <div class="signature-line"></div>
   </div>

   <aside class="showcase" aria-label="Budgie product preview">
       <div class="vault-card"><div class="device"><img src="public/budgie-home.png" alt="Budgie dashboard on a phone"></div></div>
     <div class="floating-note"><span>Intelligent guidance</span><strong>Know what to protect first.</strong></div>
  </aside>

  <div class="safe-zone" aria-hidden="true"></div>
</main>
</body>
</html>
